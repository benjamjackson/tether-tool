name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  sony-helper-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Sony tether helper
        run: bash native/sony/build-mac.sh
      - name: Load Sony's libraries and look for cameras (none on CI)
        run: ./native/sony/bin/sony-tether --probe
